[project]
name = "transformer-original-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "optuna>=4.3.0",
    "orch",
    "pandas>=2.2.3",
    "pathlib>=1.0.1",
    "plotly>=6.0.1",
    "scikit-learn>=1.6.1",
    "toml>=0.10.2",
    "torch",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "umap-learn>=0.5.7",
    "wandb>=0.19.9",
]
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
